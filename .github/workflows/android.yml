name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Build do app web
        run: npm run build

      - name: Copiar app para o projeto Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Organnize.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Organnize-apk
          path: Organnize.apk

      - name: Publicar na release "apk-latest" (download fácil pelo celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Organnize.apk \
            --title "Organnize — APK mais recente" \
            --notes "Gerado automaticamente a partir de ${GITHUB_SHA::7}. Baixe o Organnize.apk no celular e instale."
